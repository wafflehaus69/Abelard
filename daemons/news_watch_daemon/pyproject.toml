[project]
name = "news-watch-daemon"
version = "0.1.0"
description = "Narrative-state engine for OpenClaw: scrapes headlines, synthesizes per-theme narratives, alerts on shifts."
requires-python = ">=3.11"
# abelard_common is a real import dependency (alert.abelard_queue_sink, and as
# of the dedupe hoist scrape.orchestrator + synthesize.materiality). It is NOT
# declared below: it is a monorepo editable install, not a published package, so
# a bare `abelard-common` requirement would resolve against PyPI and fail.
# Install it FIRST: pip install -e ../common
# Matches consensus/pyproject.toml and abelard_queue/pyproject.toml; scripts/setup.sh
# does this automatically.
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18,<1.0",
    "feedparser>=6.0",
    "telethon>=1.40,<2.0",
    "anthropic>=0.40,<2.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
news-watch-daemon = "news_watch_daemon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["news_watch_daemon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
