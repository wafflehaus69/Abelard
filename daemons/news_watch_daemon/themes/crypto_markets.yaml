synthesis:
  cadence_hours: 4
  min_headlines_to_synthesize: 5
  model: claude-sonnet-4-6
  max_tokens_output: 1000

alerts:
  # Baseline from the measured corpus (~19 primary tags per 24h window before
  # the dedicated feed below). Start conservative; retune on observed volume.
  velocity_baseline_headlines_per_day: 20.0
  velocity_spike_multiplier: 3.0
  on_narrative_shift: true
  on_new_counter_evidence: true
  alert_channels:
    - telegram
    - abelard_queue

rss_feeds:
  # Dedicated Google News query — verified live 2026-08-19 (HTTP 200, 100
  # items/24h, keyless). The action-word clause (price OR rally OR selloff OR ETF
  # OR flows OR liquidation OR outflows) is what keeps this a MARKET feed rather
  # than a general-crypto firehose, and the negative terms strip retail/affiliate
  # noise ("how to buy", giveaways, airdrops). Live sample was on-target and
  # source-diverse: CoinDesk, Investopedia, Decrypt, Yahoo Finance on a $68-70K
  # break, a $1B short squeeze, and ETF inflows. Placement is organizational only
  # (global fetch-dedup by feed_id; global tagging).
  - url: "https://news.google.com/rss/search?q=%28bitcoin%20OR%20ethereum%20OR%20%22crypto%20market%22%20OR%20cryptocurrency%29%20%28price%20OR%20rally%20OR%20selloff%20OR%20ETF%20OR%20flows%20OR%20liquidation%20OR%20outflows%29%20-%22promo%20code%22%20-%22how%20to%20buy%22%20-giveaway%20-airdrop%20when%3A24h&hl=en-US&gl=US&ceid=US:en"
    feed_id: gn_crypto_markets

telegram_channels: []
