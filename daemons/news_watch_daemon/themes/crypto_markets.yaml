theme_id: crypto_markets
display_name: Cryptocurrency Markets — Price, Flows & Venues
status: active
created_at: 2026-08-19

brief: |
  Tracks CRYPTOCURRENCY AS A MARKET: price action and the forces moving it —
  spot moves in the major assets, ETF and fund flows, leverage and liquidations,
  treasury-company accumulation, exchange/venue events, mining economics, and
  the macro linkages (rates, dollar, risk appetite) that increasingly drive
  crypto alongside equities.

  SCOPE BOUNDARY — THIS IS THE MARKET, NOT THE PLUMBING. The daemon already has
  a dedicated tokenized_finance_infrastructure section for stablecoins,
  tokenization, RWAs, and payment rails. That theme deliberately EXCLUDES price
  action (its exclusion list strips "Bitcoin price", "crypto rally", "meme coin",
  "crypto winter", "DeFi yield"), so this theme is its complement — it picks up
  exactly what tokenized throws away. When writing this segment, lead with MARKET
  developments; do NOT rehash stablecoin/tokenization infrastructure news that
  the tokenized section already covers. A story that is genuinely both (a chain
  hosting a tokenized equity listing) may tag both — multi-tag is correct — but
  the crypto_markets read should be the market angle, not the plumbing angle.

  The thesis is that crypto has become a macro-correlated risk asset with its own
  reflexive plumbing: ETF flows and treasury-company balance sheets now transmit
  traditional-finance capital into a market whose leverage cascades still move
  faster than equities. Its reaction to rates, Treasury policy, and geopolitical
  shocks is a live read on aggregate risk appetite — the reason it belongs in a
  markets brief rather than a technology one.

  Material signals: spot moves and level breaks in BTC/ETH and the major alts;
  spot-ETF creations/redemptions and fund flows; liquidation cascades, funding
  rates, and leverage build-up; digital-asset-treasury companies accumulating or
  selling; exchange outages, licensing wins/exits, and venue failures; mining
  economics (hashrate, difficulty, halving, energy costs); enforcement and
  market-structure rulings that move price; and correlation breaks vs equities,
  gold, and the dollar.

  Prior thesis (updated by synthesis cycles): unset at theme creation.

keywords:
  # Case-sensitivity is AUTOMATIC for 2+ consecutive uppercase (BTC, ETH, XRP,
  # ETF) — written BARE, never as literal (?-i:...). So "BTC"/"ETH" match only
  # the uppercase ticker, not the letters inside other words. Plurals and
  # hyphenated forms are listed EXPLICITLY (word-boundary matching does not fold
  # them). Verified against the live corpus 2026-08-19: 19 tags in a 24h window.
  primary:
    - "Bitcoin"
    - "BTC"
    - "Ethereum"
    - "Ether"
    - "ETH"
    - "Solana"
    - "XRP"
    - "Dogecoin"
    - "cryptocurrency"
    - "crypto market"
    - "crypto markets"
    - "altcoin"
    - "altcoins"
    - "memecoin"
    - "meme coin"
    - "crypto rally"
    - "crypto selloff"
    - "crypto crash"
    - "crypto winter"
    - "crypto exchange"
    - "Binance"
    - "Coinbase"
    - "bitcoin ETF"
    - "ether ETF"
    - "crypto ETF"
    - "spot bitcoin ETF"
    - "bitcoin mining"
    - "crypto mining"
    - "halving"
    - "digital asset treasury"
  secondary:
    - "crypto trading"
    - "crypto investor"
    - "crypto investors"
    - "crypto liquidation"
    - "crypto liquidations"
    - "crypto fund"
    - "crypto custody"
    - "token price"
    - "DeFi"
    - "decentralized finance"
    - "on-chain"
    - "hash rate"
    - "hashrate"
    - "cold wallet"
    - "self-custody"
  exclusions:
    # Deliberately minimal, mirroring capital_markets / prediction_markets:
    # overlap with tokenized (a chain hosting tokenized equities), capital_markets
    # (a Coinbase earnings print) and fed_policy_path (a rates-driven crypto move)
    # is EXPECTED and correct — multi-tag is the intended behavior. The
    # market-vs-plumbing split is enforced in the BRIEF above (which steers the
    # summarizer), NOT by aggressive exclusions that would force single-tagging.
    # Trim on retag evidence only if it balloons on generic chatter.
    []

tracked_entities:
